<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ستيج كافيه | روابطنا</title>
<meta name="description" content="اطلب من تطبيق ستيج، أو من تطبيقات التوصيل بتوصيل مجاني، وتابعنا، واعرف مواقع فروعنا.">
<meta name="theme-color" content="#21160F">
<meta property="og:title" content="ستيج كافيه | روابطنا">
<meta property="og:description" content="التوصيل مجاني في جميع تطبيقات التوصيل · مواقع فروع ستيج">
<meta property="og:image" content="assets/icon-512.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7E7D7;
    --espresso:#21160F;
    --card:#33241A;
    --card-hi:#3E2C20;
    --line:rgba(247,231,215,.12);
    --gold:#C9A36A;
    --gold-2:#E2C08A;
    --muted:rgba(247,231,215,.62);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:var(--espresso);color:var(--cream);min-height:100vh;line-height:1.55;
    background-image:radial-gradient(120% 55% at 50% -10%, rgba(201,163,106,.22), transparent 60%);
    background-repeat:no-repeat;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:480px;margin:0 auto;padding:44px 18px 32px}

  /* hero */
  .hero{text-align:center;margin-bottom:28px}
  .hero img{width:200px;max-width:58%;height:auto;display:block;margin:0 auto 14px}
  .tagline{color:var(--muted);font-size:15px}

  /* primary CTA */
  .cta{
    display:flex;align-items:center;gap:14px;background:var(--cream);color:var(--espresso);
    border-radius:var(--radius);padding:18px;margin-bottom:30px;
    box-shadow:0 12px 34px rgba(0,0,0,.35);transition:transform .15s ease;
  }
  .cta:hover{transform:translateY(-2px)}
  .cta:active{transform:scale(.985)}
  .cta .ico{flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--espresso)}
  .cta .ico img{width:100%;height:100%;display:block}
  .cta .txt{flex:1;min-width:0}
  .cta .t1{display:block;font-size:18px;font-weight:700;line-height:1.3}
  .cta .t2{display:block;font-size:13px;color:#5b4434;margin-top:2px}
  .cta .arrow{flex:none;width:22px;height:22px;opacity:.7}

  /* section titles */
  h2{font-size:14px;font-weight:600;color:var(--gold-2);margin:0 4px 12px;display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  section{margin-bottom:30px}

  /* free delivery ribbon */
  .ribbon{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--espresso);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(201,163,106,.22);
  }
  .ribbon svg{flex:none;width:34px;height:34px}
  .ribbon strong{display:block;font-size:17px;font-weight:700;line-height:1.3}
  .ribbon span{font-size:13px;opacity:.8}

  /* delivery apps — one row, logos only */
  .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .app{
    aspect-ratio:1;border-radius:22%;overflow:hidden;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);
    box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .15s ease;
  }
  .app:hover{transform:translateY(-3px)}
  .app:active{transform:scale(.95)}
  .app img{width:100%;height:100%;object-fit:cover;display:block}
  .app .fallback{font-weight:700;font-size:22px;color:#fff;width:100%;height:100%;display:grid;place-items:center}

  /* socials */
  .socials{display:flex;justify-content:center;gap:14px}
  .social{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--cream);
    transition:background .15s ease, transform .15s ease;
  }
  .social:hover{background:var(--card-hi);transform:translateY(-2px)}
  .social svg{width:23px;height:23px;fill:currentColor}

  /* branches */
  .city{margin-bottom:14px}
  .city-name{font-size:13px;color:var(--muted);margin:0 4px 8px}
  .branch{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 12px 12px 14px;margin-bottom:8px;transition:background .15s ease;
  }
  .branch:hover{background:var(--card-hi)}
  .branch .pin{flex:none;width:38px;height:38px;border-radius:50%;background:rgba(247,231,215,.08);display:grid;place-items:center;color:var(--gold-2)}
  .branch .pin svg{width:20px;height:20px}
  .branch .info{flex:1;min-width:0}
  .branch .bname{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
  .branch .bsub{display:block;font-size:12.5px;color:var(--muted)}
  .branch .map{flex:none;font-size:13px;font-weight:600;background:var(--cream);color:var(--espresso);border-radius:999px;padding:8px 14px}

  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:8px}

  .rise{opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}}
  a:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   إعدادات الصفحة — كل الروابط والأسماء هنا
   ========================================================= */
const CONFIG = {
  tagline: "قهوتك وحلاك المفضل، أقرب لك",

  // تطبيق متجر ستيج (اوردر)
  order: {
    title: "اطلب من تطبيق ستيج",
    sub: "حمّل التطبيق واجمع نقاط الولاء مع كل طلب",
    url: "https://stage.order.sa/app"
  },

  freeDelivery: { title: "التوصيل مجاني", sub: "في جميع تطبيقات التوصيل" },

  // تطبيقات التوصيل: الرابط يفتح متجر التطبيقات حسب جهاز العميل
  // ios = رقم التطبيق في App Store · android = رابط Google Play
  // icon = (اختياري) مسار ملف شعار رسمي، مثال: "assets/apps/jahez.png"
  apps: [
    { name: "هنقرستيشن", ios: "596011949",  android: "https://play.google.com/store/apps/details?id=com.hungerstation.android.web", letter:"هـ", color:"#F5C400" },
    { name: "جاهز",      ios: "1137352156", android: "https://play.google.com/store/apps/details?id=net.jahez",                     letter:"ج",  color:"#C8102E" },
    { name: "نينجا",     ios: "1620153149", android: "https://play.google.com/store/apps/developer?id=Ana+Ninja",                   letter:"ن",  color:"#4B2BD6" },
    { name: "كيتا",      ios: "1662451643", android: "https://play.google.com/store/apps/details?id=com.sankuai.sailor.afooddelivery", letter:"ك", color:"#FFC300" }
  ],

  socials: [
    { name: "انستقرام", icon: "instagram", url: "https://www.instagram.com/stagecafe.sa" },
    { name: "تيك توك",  icon: "tiktok",    url: "https://www.tiktok.com/@stagecafe.sa" }
  ],

  branches: [
    { city: "الرياض",     name: "فرع الرياض",                 sub: "",                         url: "https://maps.app.goo.gl/B3dyVqzitF3tAx3RA" },
    { city: "حفر الباطن", name: "فرع البلدية",                sub: "حي البلدية · طريق عثمان بن عفان",   url: "https://maps.app.goo.gl/iwYbNKqGSu35mCDo9" },
    { city: "حفر الباطن", name: "فرع الفيصلية",               sub: "حي الفيصلية · طريق الملك عبدالعزيز", url: "https://maps.app.goo.gl/Yu7XTqRxH2bfpER28" },
    { city: "القيصومة",   name: "فرع القيصومة",               sub: "",                       url: "https://maps.app.goo.gl/AfqCqZYbgwx82NCx5" },
    { city: "رفحاء",      name: "فرع رفحاء",                  sub: "",                          url: "https://maps.app.goo.gl/EgvXvMrAovibvV6L6" }
  ]
};
/* ========================================================= */

const ICONS = {
  instagram: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>'
};
const I = {
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17V6a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1"/><path d="M14 9h4l3 3.5V16a1 1 0 0 1-1 1h-1"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/><path d="M9 17.5h6"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>'
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ext = url => `href="${esc(url)}" target="_blank" rel="noopener"`;

// نوع جهاز العميل
const ua = navigator.userAgent || "";
const IS_IOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(ua);
const appLink = a => IS_ANDROID ? a.android : `https://apps.apple.com/sa/app/id${a.ios}`;

function render(){
  const c = CONFIG; let d = 0;
  const r = () => `class="rise" style="animation-delay:${(d++)*60}ms"`;

  const apps = c.apps.map((a,i) => `
    <a class="app" data-i="${i}" ${ext(appLink(a))} aria-label="${esc(a.name)}" title="${esc(a.name)}">
      ${a.icon ? `<img src="${esc(a.icon)}" alt="${esc(a.name)}">`
               : `<span class="fallback" style="background:${esc(a.color)}">${esc(a.letter)}</span>`}
    </a>`).join('');

  const socials = c.socials.map(s => `
    <a class="social" ${ext(s.url)} aria-label="${esc(s.name)}" title="${esc(s.name)}">${ICONS[s.icon]||''}</a>`).join('');

  const cities = [...new Set(c.branches.map(b => b.city))];
  const branches = cities.map(city => `
    <div class="city">
      <div class="city-name">${esc(city)}</div>
      ${c.branches.filter(b => b.city === city).map(b => `
        <a class="branch" ${ext(b.url)}>
          <span class="pin">${I.pin}</span>
          <span class="info"><span class="bname">${esc(b.name)}</span>${b.sub ? `<span class="bsub">${esc(b.sub)}</span>` : ""}</span>
          <span class="map">الموقع</span>
        </a>`).join('')}
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <header class="hero">
      <img ${r()} src="assets/stage-wordmark.png" alt="STAGE ستيج كافيه" width="560" height="166">
      <p class="tagline rise" style="animation-delay:${(d++)*60}ms">${esc(c.tagline)}</p>
    </header>

    <div ${r()}>
      <a class="cta" ${ext(c.order.url)}>
        <span class="ico"><img src="assets/apple-touch-icon.png" alt=""></span>
        <span class="txt"><span class="t1">${esc(c.order.title)}</span><span class="t2">${esc(c.order.sub)}</span></span>
        <span class="arrow">${I.arrow}</span>
      </a>
    </div>

    <section ${r()}>
      <h2>تطبيقات التوصيل</h2>
      <div class="ribbon">${I.truck}<div><strong>${esc(c.freeDelivery.title)}</strong><span>${esc(c.freeDelivery.sub)}</span></div></div>
      <div class="apps">${apps}</div>
    </section>

    <section ${r()}>
      <h2>تابعنا</h2>
      <div class="socials">${socials}</div>
    </section>

    <section ${r()}>
      <h2>فروعنا</h2>
      ${branches}
    </section>

    <footer ${r()}>© ${new Date().getFullYear()} ستيج كافيه</footer>
  `;
  loadStoreIcons();
}

// أيقونات التطبيقات الرسمية من App Store (عبر Apple Search API) — إذا ما تحملت تبقى الأيقونة البديلة
function loadStoreIcons(){
  CONFIG.apps.forEach((a, i) => {
    if (a.icon || !a.ios) return;
    const cb = "__appIcon" + i;
    window[cb] = data => {
      try{
        const res = data && data.results && data.results[0];
        const src = res && (res.artworkUrl512 || res.artworkUrl100);
        if (!src) return;
        const img = new Image();
        img.alt = a.name;
        img.onload = () => { const el = document.querySelector(`.app[data-i="${i}"]`); if (el) el.replaceChildren(img); };
        img.src = src;
      }catch(e){}
      try{ delete window[cb]; }catch(e){}
    };
    const s = document.createElement('script');
    s.src = `https://itunes.apple.com/lookup?id=${a.ios}&country=sa&callback=${cb}`;
    s.async = true; s.onerror = () => s.remove();
    document.head.appendChild(s);
  });
}

render();
</script>
</body>
</html>
